<!DOCTYPE html>
<html lang="es">
<head>
     <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Formulario</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
</head>
<body>
  <header class="header">
    <a href="home" class="logo">Diego<span>Pérez</span></a>
    <i class='bx bx-menu' id="menu-icon"></i>
    <nav class="navbar">
      <a href="index.html">Volver al Portafolio</a>
    </nav>
  </header>

  <div class="btn-group">
    
  </div>

  <section class="contact">
    <h2 class="heading">Formulario de Contacto</h2>
    <form class="contact-form">
      <input type="text" class="input-box" placeholder="Tu nombre" required />
      <input type="email" class="input-box" placeholder="Tu correo" required />
      <textarea class="input-box" rows="5" placeholder="Tu mensaje"></textarea>
      <button type="submit" class="btn">Enviar</button>
    </form>
  </section>
  <div class="modal" id="confirmModal">
  <div class="modal-content">
    <span class="close-btn" id="closeModal">&times;</span>
    <h2>¿Confirma el envío?</h2>
    <p id="modalMensaje"></p>
    <button class="btn" id="modalAceptar">Aceptar</button>
  </div>
</div>

<script src="validaciones.js"></script>
</body>
</html>

</body>
</html>
